[project]
name = "pv-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "marblehub", email = "goodfriend.whyte@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=25.3.0",
    "joblib>=1.5.3",
    "mlflow>=3.11.1",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "pip>=26.1.1",
    "scikit-learn>=1.8.0",
]

[project.scripts]
pv-predictor = "pv_predictor:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
