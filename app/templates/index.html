<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>☀️ PV Power Output Predictor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Fonts & Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark');
            localStorage.setItem(
                'theme',
                document.body.classList.contains('dark') ? 'dark' : 'light'
            );
        }

        window.onload = function () {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
            }
        }
    </script>
</head>

<body>
    <div class="container">
        <h2>☀️ PV Power Predictor</h2>

        <img src="{{ url_for('static', filename='app_logo.png') }}" alt="PV Logo" class="logo">

        <!-- UPDATED: POST to "/" -->
        <form method="post" action="/">
            <input 
                type="number" 
                name="temperature" 
                step="0.1" 
                placeholder="Temperature (°C)" 
                required
            >

            <input 
                type="number" 
                name="irradiance" 
                step="1" 
                placeholder="Irradiance (W/m²)" 
                required
            >

            <input type="submit" value="Predict">
        </form>

        <!-- Better conditional handling -->
        
        {% if prediction is not none %}
        <div class="result">
            For {{ temperature }} °C & {{ irradiance }} W/m²:
            <br>
            Predicted Power Output:
            <strong>{{ "%.3f"|format(prediction) }} kW</strong>
        </div>
        <hr class="divider">
        <div class="meta">
            Model: {{ model_name }} · Tracked with MLflow
        </div>
        {% endif %}

        <button class="toggle-btn" onclick="toggleDarkMode()">
            🌓 Toggle Dark Mode
        </button>

        <footer>
            ⚡ Powered by Flask · Scikit-learn · MLflow
        </footer>
    </div>
</body>
</html>
